<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Full 10-Finger Hand Skeleton Tracking</title>
  <style>
    body {
      margin: 0;
      background: #090a0f;
      color: #00f3ff;
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    .viewport {
      position: relative;
      width: 1280px;
      height: 720px;
      border: 1px solid rgba(0, 243, 255, 0.3);
      border-radius: 8px;
      overflow: hidden;
    }
    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: scaleX(-1); /* Mirror view */
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm/vision_bundle.js" crossorigin="anonymous"></script>
</head>
<body>

<div class="viewport">
  <video id="webcam" autoplay playsinline></video>
  <canvas id="canvas"></canvas>
</div>

<script type="module">
  import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest";

  const video = document.getElementById("webcam");
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  let handLandmarker = null;
  let lastVideoTime = -1;

  // Struktur Koneksi Sendi MediaPipe Hand (21 Landmark/Tangan)
  const HAND_CONNECTIONS = [
    [0, 1], [1, 2], [2, 3], [3, 4],           // Ibu Jari
    [0, 5], [5, 6], [6, 7], [7, 8],           // Telunjuk
    [5, 9], [9, 10], [10, 11], [11, 12],      // Jari Tengah
    [9, 13], [13, 14], [14, 15], [15, 16],    // Jari Manis
    [13, 17], [0, 17], [17, 18], [18, 19], [19, 20] // Kelingking & Telapak
  ];

  async function initTracker() {
    const vision = await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm"
    );
    
    handLandmarker = await HandLandmarker.createFromOptions(vision, {
      baseOptions: {
        modelAssetPath: `https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task`,
        delegate: "GPU"
      },
      runningMode: "VIDEO",
      numHands: 2 // Lacak 2 tangan (10 Jari Penuh)
    });

    startCamera();
  }

  async function startCamera() {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { width: 1280, height: 720, frameRate: { ideal: 60 } }
    });
    video.srcObject = stream;
    video.addEventListener("loadeddata", renderLoop);
  }

  function renderLoop() {
    if (canvas.width !== video.videoWidth) {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
    }

    if (handLandmarker && video.currentTime !== lastVideoTime) {
      lastVideoTime = video.currentTime;
      const results = handLandmarker.detectForVideo(video, performance.now());

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (results.landmarks && results.landmarks.length > 0) {
        const framePoints = [];

        results.landmarks.forEach((landmarks) => {
          // 1. Gambar Seluruh Tulang & Sendi 10 Jari
          drawFullHandSkeleton(landmarks);

          // Ambil titik Telunjuk & Ibu Jari untuk Cyber Frame
          framePoints.push({
            index: { x: landmarks[8].x * canvas.width, y: landmarks[8].y * canvas.height },
            thumb: { x: landmarks[4].x * canvas.width, y: landmarks[4].y * canvas.height }
          });
        });

        // 2. Gambar Frame Transparan jika 2 tangan terdeteksi
        if (framePoints.length === 2) {
          drawCyberFrame(framePoints[0], framePoints[1]);
        }
      }
    }

    requestAnimationFrame(renderLoop);
  }

  // Menggambar Seluruh Sendi & Tulang Jari
  function drawFullHandSkeleton(landmarks) {
    // A. Gambar Garis Tulang Jari
    ctx.strokeStyle = "rgba(0, 243, 255, 0.7)";
    ctx.lineWidth = 3;

    HAND_CONNECTIONS.forEach(([i, j]) => {
      const p1 = landmarks[i];
      const p2 = landmarks[j];
      ctx.beginPath();
      ctx.moveTo(p1.x * canvas.width, p1.y * canvas.height);
      ctx.lineTo(p2.x * canvas.width, p2.y * canvas.height);
      ctx.stroke();
    });

    // B. Gambar Titik Sendi (21 Titik)
    landmarks.forEach((pt, index) => {
      ctx.beginPath();
      ctx.arc(pt.x * canvas.width, pt.y * canvas.height, 5, 0, 2 * Math.PI);
      
      // Ujung jari diberi warna beda biar mencolok
      if ([4, 8, 12, 16, 20].includes(index)) {
        ctx.fillStyle = "#ff0055"; // Merah Neon untuk Ujung Jari
      } else {
        ctx.fillStyle = "#00f3ff"; // Cyan Neon untuk Sendi
      }
      ctx.fill();
    });
  }

  // Cyber Frame Antara Kedua Tangan
  function drawCyberFrame(h1, h2) {
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(h1.index.x, h1.index.y);
    ctx.lineTo(h1.thumb.x, h1.thumb.y);
    ctx.lineTo(h2.thumb.x, h2.thumb.y);
    ctx.lineTo(h2.index.x, h2.index.y);
    ctx.closePath();

    ctx.fillStyle = "rgba(0, 243, 255, 0.15)";
    ctx.fill();

    ctx.strokeStyle = "#00f3ff";
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 4]);
    ctx.stroke();
    ctx.restore();
  }

  initTracker();
</script>
</body>
</html>
