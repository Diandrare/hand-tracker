<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Proximity Dynamic Cyber Frame - 10 Jari Realtime</title>
  <style>
    body {
      margin: 0;
      background: #090a0f;
      color: #00f3ff;
      font-family: monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    .viewport {
      position: relative;
      width: 1280px;
      height: 720px;
      border: 1px solid rgba(0, 243, 255, 0.3);
      border-radius: 8px;
      overflow: hidden;
    }
    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: scaleX(-1); /* Mirror view */
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm/vision_bundle.js" crossorigin="anonymous"></script>
</head>
<body>

<div class="viewport">
  <video id="webcam" autoplay playsinline></video>
  <canvas id="canvas"></canvas>
</div>

<script type="module">
  import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest";

  const video = document.getElementById("webcam");
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  let handLandmarker = null;
  let lastVideoTime = -1;

  // Ujung 5 jari: [Ibu Jari (4), Telunjuk (8), Jari Tengah (12), Jari Manis (16), Kelingking (20)]
  const FINGER_TIPS = [4, 8, 12, 16, 20];

  // Garis koneksi sendi tulang tangan
  const HAND_CONNECTIONS = [
    [0,1],[1,2],[2,3],[3,4], [0,5],[5,6],[6,7],[7,8],
    [5,9],[9,10],[10,11],[11,12], [9,13],[13,14],[15,16],[13,14],[14,15],
    [13,17],[0,17],[17,18],[18,19],[19,20]
  ];

  // BATAS JARAK BERSENTUHAN/MENDEKAT (dalam piksel)
  const TOUCH_THRESHOLD = 90; 

  async function initTracker() {
    const vision = await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm"
    );
    
    handLandmarker = await HandLandmarker.createFromOptions(vision, {
      baseOptions: {
        modelAssetPath: `https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task`,
        delegate: "GPU"
      },
      runningMode: "VIDEO",
      numHands: 2
    });

    startCamera();
  }

  async function startCamera() {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { width: 1280, height: 720, frameRate: { ideal: 60 } }
    });
    video.srcObject = stream;
    video.addEventListener("loadeddata", renderLoop);
  }

  // Hitung Jarak 2 Titik (Euclidean Distance)
  function getDistance(p1, p2) {
    return Math.hypot(p1.x - p2.x, p1.y - p2.y);
  }

  function renderLoop() {
    if (canvas.width !== video.videoWidth) {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
    }

    if (handLandmarker && video.currentTime !== lastVideoTime) {
      lastVideoTime = video.currentTime;
      const results = handLandmarker.detectForVideo(video, performance.now());

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (results.landmarks && results.landmarks.length > 0) {
        
        // 1. Gambar Skeleton Sendi 10 Jari
        results.landmarks.forEach(landmarks => drawSkeleton(landmarks));

        // 2. Jika 2 Tangan Terdeteksi, Cek Jari yang Bersentuhan/Mendekat
        if (results.landmarks.length === 2) {
          const handA = results.landmarks[0];
          const handB = results.landmarks[1];

          for (let i = 0; i < FINGER_TIPS.length - 1; i++) {
            const idx1 = FINGER_TIPS[i];
            const idx2 = FINGER_TIPS[i + 1];

            const p1 = getCoords(handA[idx1]);
            const p2 = getCoords(handA[idx2]);
            const p3 = getCoords(handB[idx2]);
            const p4 = getCoords(handB[idx1]);

            // Cek jarak antara pasangan jari kiri dan kanan
            const distTop = getDistance(p1, p4);
            const distBottom = getDistance(p2, p3);

            // Kotak HANYA DIGAMBAR jika jari-jari tersebut saling mendekat/bersentuhan
            if (distTop < TOUCH_THRESHOLD || distBottom < TOUCH_THRESHOLD) {
              drawDashedBox(p1, p2, p3, p4, `FRAME 0${i+1}`);
            }
          }
        }
      }
    }

    requestAnimationFrame(renderLoop);
  }

  function getCoords(pt) {
    return { x: pt.x * canvas.width, y: pt.y * canvas.height };
  }

  // Menggambar Kotak Garis Putus-Putus
  function drawDashedBox(p1, p2, p3, p4, label) {
    ctx.save();
    
    ctx.beginPath();
    ctx.moveTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.lineTo(p3.x, p3.y);
    ctx.lineTo(p4.x, p4.y);
    ctx.closePath();

    // Isian transparan saat terhubung
    ctx.fillStyle = "rgba(0, 243, 255, 0.12)";
    ctx.fill();

    // Border Garis Putus-Putus Glowing
    ctx.strokeStyle = "#00f3ff";
    ctx.lineWidth = 2;
    ctx.setLineDash([8, 4]);
    ctx.shadowColor = "#00f3ff";
    ctx.shadowBlur = 10;
    ctx.stroke();

    // Teks Label
    ctx.fillStyle = "#00f3ff";
    ctx.font = "11px monospace";
    ctx.fillText(`${label} // CONNECTED`, p1.x + 5, p1.y - 8);

    ctx.restore();
  }

  function drawSkeleton(landmarks) {
    ctx.strokeStyle = "rgba(0, 243, 255, 0.35)";
    ctx.lineWidth = 2;
    HAND_CONNECTIONS.forEach(([i, j]) => {
      ctx.beginPath();
      ctx.moveTo(landmarks[i].x * canvas.width, landmarks[i].y * canvas.height);
      ctx.lineTo(landmarks[j].x * canvas.width, landmarks[j].y * canvas.height);
      ctx.stroke();
    });

    landmarks.forEach((pt, idx) => {
      ctx.beginPath();
      ctx.arc(pt.x * canvas.width, pt.y * canvas.height, 4, 0, 2 * Math.PI);
      ctx.fillStyle = FINGER_TIPS.includes(idx) ? "#ff0055" : "#00f3ff";
      ctx.fill();
    });
  }

  initTracker();
</script>
</body>
</html>
